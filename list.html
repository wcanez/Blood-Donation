<head>

</head>

<body class="inner-page d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="home.html">
       <img src="./images/blood-bank-logo.jpg" alt="Blood Bank Logo" class="blood-bank-logo">
    <span>BLOOD BANK</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto text-center">
          <li class="nav-item"><a class="nav-link" href="home.html#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="home.html#about">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="register_donor.html">Donors</a></li>
          <li class="nav-item ms-lg-3">
            <button class="btn btn-primary-custom" onclick="logout()">
              <i class="bi bi-box-arrow-right me-1"></i>
              Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  
<!-- Donor Dashboard -->
<section class="donor-dashboard">

    <div class="container section-padding">

        <!-- Heading -->
        <div class="donor-heading text-center">
            <h1>Registered Donors</h1>
            <p>Together, we can save lives</p>
        </div>

        <!-- Donor Table -->
        <div class="custom-card donor-table-card">

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Address</th>
                            <th>Blood Group</th>
                            <th>Age</th>
                            <th>Phone</th>
                            <th>Date</th>
                            <th class="text-center">Action</th>
                        </tr>
                    
                    </thead>

                    <tbody id="userTableBody">
                        <!-- Donor details loaded from database -->
                    </tbody>

                </table>
            </div>
        </div>

        <!-- Bottom Message -->
        <div class="text-center mt-4">
            <p class="donor-footer-text">
                <i class="bi bi-heart-pulse-fill"></i>
                Every Drop Counts. Every Donor Matters.
            </p>
        </div>

    </div>

</section>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <p class="mb-0">&copy; 2025 Blood Donation System. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    
// Session Check
const sessionCookie = document.cookie.split('; ')
    .find(row => row.startsWith('blood_bank_session='));

const localSession = localStorage.getItem('blood_bank_session');

if (!sessionCookie && !localSession) {
    window.location.href = "login.html";
}

// Logout
function logout() {
    document.cookie = "blood_bank_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    localStorage.removeItem('blood_bank_session');
    window.location.href = "login.html";
}

// Fetch Donors
function fetchDonors() {
    fetch('fetch_all_donors.php')
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById('userTableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center">
                            No donors registered yet.
                        </td>
                    </tr>`;
                return;
            }

            data.forEach(user => {
                const row = tableBody.insertRow();

                const nameCell = row.insertCell();
                nameCell.textContent = user.name;

                const addressCell = row.insertCell();
                addressCell.textContent = user.address;

                const groupCell = row.insertCell();
                groupCell.innerHTML = `<span class="badge bg-danger"></span>`;
                groupCell.querySelector('.badge').textContent = user.blood_group;

                const ageCell = row.insertCell();
                ageCell.textContent = user.age;

                const phoneCell = row.insertCell();
                phoneCell.textContent = user.phone;

                const dateCell = row.insertCell();
                dateCell.textContent = user.donation_date;

                const actionCell = row.insertCell();
                actionCell.className = 'text-center';

            /* Delete Button */
                const deleteBtn = document.createElement('button');

                deleteBtn.type = 'button';
                deleteBtn.className = 'btn btn-sm btn-outline-danger';
                deleteBtn.title = 'Delete Donor';

                deleteBtn.innerHTML = '<i class="bi bi-trash"></i>';

                deleteBtn.onclick = () => deleteDonor(user.id);

                actionCell.appendChild(deleteBtn);
            });
        })
        .catch(error => console.error('Error fetching donors:', error));
}

// Delete Donor
function deleteDonor(id) {
    if (confirm("Are you sure you want to delete this donor?")) {
        fetch('delete_donor.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id: id })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                alert('Donor deleted successfully!');
                fetchDonors();
            } else {
                alert('Error deleting donor.');
            }
        })
        .catch(error => console.error('Error:', error));
    }
}

// Load Donors
fetchDonors();

  </script>
</body>

</html>
