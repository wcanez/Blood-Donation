  <!-- Register Donor Form -->
<div class="container section-padding">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

      <div class="custom-card donor-form-card">
        <h3 class="fw-bold mb-4 text-center" id="formTitle">
          <i class="bi bi-droplet-fill text-danger"></i>
            Register Donor
        </h3>

        <!-- Success Message -->
        <div id="successMessage"
             class="alert alert-success d-none"
             role="alert">
          <i class="bi bi-check-circle-fill"></i>
          <strong>Registered Successfully!</strong>
          Donor details have been saved successfully.
        </div>

        <form action="register_donor.php" method="POST" id="mainForm">

          <input type="hidden" name="donor_id" id="donor_id" value="">

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name"
                   class="form-control"
                   placeholder="Enter your full name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" name="address"
                   class="form-control"
                   placeholder="Enter your address" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Blood Group</label>
            <select name="bloodGroup" class="form-select" required>
              <option value="">Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <label class="form-label">Age</label>
              <input type="number" name="age"
                     class="form-control"
                     placeholder="Enter age"
                     min="18" max="120" required>
            </div>

            <div class="col-12 col-sm-6">
              <label class="form-label">Last Donation Date</label>
              <input type="date" name="date"
                     class="form-control" required>
            </div>
          </div>

          <div class="mt-3 mb-4">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phone"
                   class="form-control"
                   placeholder="Enter phone number"
                   pattern="[0-9]{10}"
                   maxlength="10" required>
            <small class="text-muted">
              Enter a 10-digit phone number.
            </small>
          </div>
          <button type="submit" class="btn-register" id="submitBtn">
             Register Donor
          </button>
        </form>
      </div>
    </div>
  </div>
</div><br>

 <!-- Donor Details -->
<div class="container mb-5">
    <h3 class="fw-bold text-center mb-4">
        <i class="bi bi-people-fill text-danger"></i>
        Registered Donors
    </h3>

    <div class="custom-card donor-table-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Blood Group</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Date</th>
                        <th class="text-center">Action</th>
                    </tr>
                
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
const form = document.getElementById("mainForm");

const params = new URLSearchParams(window.location.search);
const donorId = params.get("id");

// Show success message
if (params.get("success") === "1" || params.get("updated") === "1") {

    const message = document.getElementById("successMessage");

    if (params.get("updated") === "1") {
        message.innerHTML = `
            <i class="bi bi-check-circle-fill"></i>
            <strong>Updated Successfully!</strong>
            Donor details have been updated.
        `;
    }

    message.classList.remove("d-none");

    setTimeout(() => {
        message.classList.add("d-none");
    }, 5000);
}

// Fetch only the current donor
function fetchDonors() {

    const tbody = document.getElementById("userTableBody");

    if (!donorId) {
        tbody.innerHTML = "";
        return;
    }

    fetch("fetch_donors.php?id=" + encodeURIComponent(donorId))
        .then(response => response.json())
        .then(donors => {

            tbody.innerHTML = "";

            donors.forEach(donor => {

                const row = document.createElement("tr");

                [
                    donor.name,
                    donor.address,
                    donor.blood_group,
                    donor.age,
                    donor.phone,
                    donor.donation_date
                ].forEach(value => {

                    const td = document.createElement("td");
                    td.textContent = value ?? "";
                    row.appendChild(td);

                });

                const action = document.createElement("td");
                action.className = "text-center";

                const editBtn = document.createElement("button");

                 editBtn.type = "button";
                editBtn.className = "btn-edit";
                editBtn.title = "Edit Donor";

                editBtn.innerHTML = '<i class="bi bi-pencil-square"></i>';

                editBtn.addEventListener("click", () => {
                editDonor(donor);
            });

                action.appendChild(editBtn);
                row.appendChild(action);

                tbody.appendChild(row);

            });

        })
        .catch(error => {
            console.error("Error fetching donor:", error);
        });
}

// Edit donor details
function editDonor(donor) {

    document.getElementById("donor_id").value = donor.id;

    form.querySelector('[name="name"]').value = donor.name;
    form.querySelector('[name="address"]').value = donor.address;
    form.querySelector('[name="bloodGroup"]').value = donor.blood_group;
    form.querySelector('[name="age"]').value = donor.age;
    form.querySelector('[name="date"]').value = donor.donation_date;
    form.querySelector('[name="phone"]').value = donor.phone;

    form.action = "update_donor.php";

    document.getElementById("formTitle").innerHTML =
        '<i class="bi bi-pencil-square text-danger"></i> Edit Donor';

    document.getElementById("submitBtn").innerHTML =
        '<i class="bi bi-check-circle-fill me-2"></i> Update Donor';

    form.scrollIntoView({ behavior: "smooth" });
}

// Logout
function logout() {
    window.location.href = "login.html";
}

// Load donor details
fetchDonors();

// Clean URL after capturing the donor ID
if (params.has("success") || params.has("updated")) {
    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );
}
</script>
